name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the project (unzip it if it was uploaded as a zip)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            rm -rf _src && mkdir _src
            unzip -q "$(ls *.zip | head -n1)" -d _src
            D="$(dirname "$(find _src -name settings.gradle | head -n1)")"
          else
            D="."
          fi
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project folder: $D"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: bryars-ai-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
